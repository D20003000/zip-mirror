name: Auto Mirror ZIP File qiftech.cn.lab.x64.tar.gz

# 触发规则：
# 每天 UTC 00:00 = 北京时间 08:00 自动运行
# 支持页面手动触发
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 下载目标文件，增加 30分钟超时 + 重试
      - name: Download target file
        run: |
          TARGET_URL="https://qiftech.cn/app/ubuntu/qiftech.cn.lab.x64.tar.gz"
          FILE_NAME="qiftech.cn.lab.x64.tar.gz"
          # 超时1800秒(3分钟)，失败重试2次
          timeout 1800 wget --tries=2 -O $FILE_NAME $TARGET_URL

      # 2. 对比本地文件是否有更新
      - name: Check file changes
        id: diff
        run: |
          FILE_NAME="qiftech.cn.lab.x64.tar.gz"
          if git status --porcelain | grep "$FILE_NAME"; then
            echo "status=updated" >> $GITHUB_OUTPUT
          else
            echo "status=nochange" >> $GITHUB_OUTPUT
          fi

      # 3. 有更新则提交推送
      - name: Commit & Push updated file
        if: steps.diff.outputs.status == 'updated'
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto update file $(date +'%Y-%m-%d %H:%M')"
          git push origin main
