 name: Auto Mirror ZIP File win64.zip

concurrency:
  group: ${{ github.workflow }}   
  cancel-in-progress: false       

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 0点 = 北京时间8点
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 35   # 整个job最多15分钟
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download target file
        timeout-minutes: 30  # 下载步骤最多30分钟
        run: |
          # 原qiftech链接（优先https）
          TARGET_URL="https://qiftech.cn/app/win/qiftech.cn.lab.exe.win64.zip"
          FILE_NAME="qiftech.cn.lab.exe.win64.zip"

          # 若要临时测GitHub raw，把上面两行注释，用下面这行：
          # TARGET_URL="https://ghproxy.cn/https://github.com/D20003000/zip-mirror/raw/refs/heads/main/test.zip"
          # FILE_NAME="test.zip"

          # 断点续传 + 超时 + 重试
          wget -c --timeout=60 --tries=3 -O $FILE_NAME $TARGET_URL

      - name: Check file changes
        id: diff
        run: |
          FILE_NAME="qiftech.cn.lab.exe.win64.zip"
          if git status --porcelain | grep "$FILE_NAME"; then
            echo "status=updated" >> $GITHUB_OUTPUT
          else
            echo "status=nochange" >> $GITHUB_OUTPUT
          fi

      - name: Commit & Push
        if: steps.diff.outputs.status == 'updated'
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto update $(date +'%Y-%m-%d %H:%M')"
          git push origin main
