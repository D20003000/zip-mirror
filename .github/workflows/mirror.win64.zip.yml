name: Auto Mirror ZIP File win64.zip

concurrency:
  group: ${{ github.workflow }}   
  cancel-in-progress: false       

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 0点 = 北京时间8点
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download target file
        timeout-minutes: 30
        run: |
          TARGET_URL="https://qiftech.cn/app/win/qiftech.cn.lab.exe.win64.zip"
          FILE_NAME="qiftech.cn.lab.exe.win64.zip"
          
          # 下载文件
          wget -c --timeout=60 --tries=3 -O $FILE_NAME $TARGET_URL
          
          # 验证下载成功
          if [ ! -f "$FILE_NAME" ] || [ ! -s "$FILE_NAME" ]; then
            echo "❌ Download failed"
            exit 1
          fi
          echo "✅ Download successful"

      - name: Check file changes
        id: diff
        run: |
          FILE_NAME="qiftech.cn.lab.exe.win64.zip"
          
          # 关键：先添加文件到暂存区
          git add "$FILE_NAME"
          
          # 检查暂存区和HEAD是否有差异（真正的文件内容对比）
          if git diff --cached --quiet; then
            echo "status=nochange" >> $GITHUB_OUTPUT
            echo "📝 File unchanged, skipping push"
          else
            echo "status=updated" >> $GITHUB_OUTPUT
            echo "🔄 File changed, will push"
          fi

      - name: Commit & Push
        if: steps.diff.outputs.status == 'updated'
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # 拉取远程最新代码，避免冲突
          git pull origin main --rebase --autostash
          
          # 提交（暂存区已经有文件）
          git commit -m "Auto update $(date +'%Y-%m-%d %H:%M')"
          
          # 推送
          git push origin main
          
          echo "✅ Push completed"
