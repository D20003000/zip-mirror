name: Auto Mirror File latest-win

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 1 * * *'   # UTC 17:00 = 北京时间次日 01:00
  workflow_dispatch:

env:
  FILE_NAME: "qiftech.cn.lab.exe.win64.zip"
  RELEASE_TAG: "latest-win"

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check remote update
        id: check
        run: |
          TARGET_URL="${{ secrets.TARGET_URL_WIN }}"
          META_FILE=".sync_meta.${FILE_NAME}"

          HEADERS=$(curl -sI --max-time 30 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "$TARGET_URL")

          LM=$(echo "$HEADERS" | grep -i "^last-modified:" | sed 's/.*: //' | tr -d '\r')
          ETAG=$(echo "$HEADERS" | grep -i "^etag:" | sed 's/.*: //' | tr -d '\r')
          CL=$(echo "$HEADERS" | grep -i "^content-length:" | sed 's/.*: //' | tr -d '\r')

          REMOTE_SIG="${LM}##${ETAG}##${CL}"
          echo "Remote: $REMOTE_SIG"

          if [ -f "$META_FILE" ]; then
            LOCAL_SIG=$(cat "$META_FILE")
            echo "Local:  $LOCAL_SIG"
          else
            LOCAL_SIG=""
          fi

          if [ "$REMOTE_SIG" != "$LOCAL_SIG" ] || [ -z "$LOCAL_SIG" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "sig=$REMOTE_SIG" >> $GITHUB_OUTPUT
            echo "✅ Update detected!"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️ No update."
          fi

      - name: Download file
        if: steps.check.outputs.changed == 'true'
        run: |
          TARGET_URL="${{ secrets.TARGET_URL_WIN }}"
          wget --timeout=60 --tries=3 -O "$FILE_NAME" "$TARGET_URL"
          SIZE=$(stat -c%s "$FILE_NAME")
          echo "Downloaded: $FILE_NAME, size: $SIZE bytes"
          if [ "$SIZE" -lt 2048 ]; then
            echo "❌ File too small, probably an error page"
            exit 1
          fi

      - name: Delete old release and local tag
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$RELEASE_TAG" --yes 2>/dev/null || true
          git push --delete origin "$RELEASE_TAG" 2>/dev/null || true
          git tag -d "$RELEASE_TAG" 2>/dev/null || true

      - name: Create release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" "$FILE_NAME" \
            --title "Mirror $FILE_NAME $(date +'%Y-%m-%d %H:%M UTC')" \
            --notes "Auto mirror"

      - name: Save metadata
        if: steps.check.outputs.changed == 'true'
        run: |
          META_FILE=".sync_meta.${FILE_NAME}"
          echo "${{ steps.check.outputs.sig }}" > "$META_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$META_FILE"
          git commit -m "chore: update metadata for $FILE_NAME $(date +%F)" || true
          git pull --rebase origin main || true
          git push origin main || true
