 name: Auto Mirror ZIP File win64

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 0 * * *'   # 北京时间每天 8:00
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # 关键：允许创建 Release 和推送代码

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史以便后续 rebase

      # ========== 步骤 1：用 HTTP Header 检测远程是否更新（不下载整个文件） ==========
      - name: Check remote update
        id: check
        run: |
          TARGET_URL="https://qiftech.cn/app/win/qiftech.cn.lab.exe.win64.zip"
          META_FILE=".sync_meta"

          HEADERS=$(curl -sI --max-time 30 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "$TARGET_URL")

          LM=$(echo "$HEADERS" | grep -i "^last-modified:" | sed 's/.*: //' | tr -d '\r')
          ETAG=$(echo "$HEADERS" | grep -i "^etag:" | sed 's/.*: //' | tr -d '\r')
          CL=$(echo "$HEADERS" | grep -i "^content-length:" | sed 's/.*: //' | tr -d '\r')

          REMOTE_SIG="${LM}##${ETAG}##${CL}"
          echo "Remote signature: $REMOTE_SIG"

          if [ -f "$META_FILE" ]; then
            LOCAL_SIG=$(cat "$META_FILE")
            echo "Local signature: $LOCAL_SIG"
          else
            LOCAL_SIG=""
          fi

          if [ "$REMOTE_SIG" != "$LOCAL_SIG" ] || [ -z "$LOCAL_SIG" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "sig=$REMOTE_SIG" >> $GITHUB_OUTPUT
            echo "url=$TARGET_URL" >> $GITHUB_OUTPUT
            echo "✅ Update detected!"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️ No update, skip."
          fi

      # ========== 步骤 2：有更新才下载（节省流量） ==========
      - name: Download file
        if: steps.check.outputs.changed == 'true'
        run: |
          wget --timeout=60 --tries=3 -O qiftech.cn.lab.exe.win64.zip "${{ steps.check.outputs.url }}"
          SIZE=$(stat -c%s qiftech.cn.lab.exe.win64.zip)
          echo "Downloaded size: $SIZE bytes"
          if [ "$SIZE" -lt 2048 ]; then
            echo "❌ File too small, probably an error page"
            exit 1
          fi

      # ========== 步骤 3：删除旧 Release（固定用 latest 标签，下载链接永久不变） ==========
      - name: Delete old release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true

      # ========== 步骤 4：上传到新 Release（大文件放这里！） ==========
      - name: Create release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest qiftech.cn.lab.exe.win64.zip \
            --title "Mirror $(date +'%Y-%m-%d %H:%M UTC')" \
            --notes "Source: ${{ steps.check.outputs.url }}"

      # ========== 步骤 5：只保存几字节的元数据到仓库 ==========
      - name: Save metadata
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ steps.check.outputs.sig }}" > .sync_meta
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .sync_meta
          git commit -m "chore: update metadata $(date +%F)" || true
          git pull --rebase origin main || true
          git push origin main || true
